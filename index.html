    <!-- Suppress harmless Vite dev HMR WebSocket disconnection errors and unhandled rejections in iFrame preview container -->
    <script>
      (function() {
        function isViteHmrUrl(url) {
          if (!url) return false;
          var u = String(url).toLowerCase();
          return u.indexOf('token=') !== -1 || u.indexOf('24678') !== -1 || u.indexOf('vite-hmr') !== -1 || u.indexOf('vite') !== -1;
        }

        function isBenign(str) {
          if (!str) return false;
          var s = String(str).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('without opened') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('vite-hmr') !== -1 ||
            s.indexOf('ws://') !== -1 ||
            s.indexOf('wss://') !== -1 ||
            s.indexOf('vite:ws') !== -1 ||
            (s.indexOf('[vite]') !== -1 && (s.indexOf('websocket') !== -1 || s.indexOf('connect') !== -1 || s.indexOf('closed') !== -1))
          );
        }

        // 1. WebSocket.prototype hooks: prevent Vite HMR client from ever failing to connect or rejecting
        if (typeof window !== 'undefined' && window.WebSocket && window.WebSocket.prototype) {
          try {
            var proto = window.WebSocket.prototype;
            var origReadyState = Object.getOwnPropertyDescriptor(proto, 'readyState');
            Object.defineProperty(proto, 'readyState', {
              configurable: true,
              enumerable: true,
              get: function() {
                try {
                  if (isViteHmrUrl(this.url)) {
                    return 1; // WebSocket.OPEN
                  }
                } catch (_) {}
                return origReadyState && origReadyState.get ? origReadyState.get.call(this) : 1;
              }
            });

            var origSend = proto.send;
            proto.send = function() {
              try {
                if (isViteHmrUrl(this.url)) return;
              } catch (_) {}
              return origSend.apply(this, arguments);
            };

            var origClose = proto.close;
            proto.close = function() {
              try {
                if (isViteHmrUrl(this.url)) return;
              } catch (_) {}
              return origClose.apply(this, arguments);
            };

            var origAddEventListener = proto.addEventListener;
            proto.addEventListener = function(type, listener, options) {
              try {
                if (isViteHmrUrl(this.url)) {
                  if (type === 'close' || type === 'error') {
                    // Suppress close/error listeners on Vite HMR socket so promise never rejects
                    return;
                  }
                  if (type === 'open') {
                    if (typeof listener === 'function') {
                      setTimeout(function() {
                        try { listener(new Event('open')); } catch (_) {}
                      }, 0);
                    }
                    return;
                  }
                }
              } catch (_) {}
              return origAddEventListener.apply(this, arguments);
            };

            var origOnCloseDesc = Object.getOwnPropertyDescriptor(proto, 'onclose');
            if (origOnCloseDesc && origOnCloseDesc.set) {
              Object.defineProperty(proto, 'onclose', {
                configurable: true,
                enumerable: true,
                get: function() { return origOnCloseDesc.get ? origOnCloseDesc.get.call(this) : null; },
                set: function(fn) {
                  try {
                    if (isViteHmrUrl(this.url)) return;
                  } catch (_) {}
                  return origOnCloseDesc.set.call(this, fn);
                }
              });
            }

            var origOnErrorDesc = Object.getOwnPropertyDescriptor(proto, 'onerror');
            if (origOnErrorDesc && origOnErrorDesc.set) {
              Object.defineProperty(proto, 'onerror', {
                configurable: true,
                enumerable: true,
                get: function() { return origOnErrorDesc.get ? origOnErrorDesc.get.call(this) : null; },
                set: function(fn) {
                  try {
                    if (isViteHmrUrl(this.url)) return;
                  } catch (_) {}
                  return origOnErrorDesc.set.call(this, fn);
                }
              });
            }
          } catch (_) {}
        }

        // 2. Wrap console.error and console.warn so dev websocket disconnect logs are completely silenced
        var origConsoleError = console.error;
        console.error = function() {
          try {
            var fullMsg = '';
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              if (a) fullMsg += ' ' + (a.stack || a.message || a);
            }
            if (isBenign(fullMsg)) {
              return;
            }
          } catch (_) {}
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          try {
            var fullMsg = '';
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              if (a) fullMsg += ' ' + (a.stack || a.message || a);
            }
            if (isBenign(fullMsg)) {
              return;
            }
          } catch (_) {}
          return origConsoleWarn.apply(console, arguments);
        };

        // 3. Helper to wrap any rejection handler
        function wrapRejectionHandler(rawHandler) {
          if (typeof rawHandler !== 'function') return rawHandler;
          return function(event) {
            try {
              var reason = event && event.reason;
              var msg = '' + (reason && (reason.stack || reason.message || reason));
              if (isBenign(msg)) {
                if (event && typeof event.preventDefault === 'function') event.preventDefault();
                if (event && typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
                return true;
              }
            } catch (_) {}
            return rawHandler.apply(this, arguments);
          };
        }

        // Helper to wrap any error handler
        function wrapErrorHandler(rawHandler) {
          if (typeof rawHandler !== 'function') return rawHandler;
          return function(message, source, lineno, colno, error) {
            try {
              var msg = '' + (message || (error && (error.stack || error.message)));
              if (isBenign(msg)) {
                return true;
              }
            } catch (_) {}
            return rawHandler.apply(this, arguments);
          };
        }

        // 4. Immediately wrap any handler that _aistudio-iframe or another script already placed
        if (typeof window.onunhandledrejection === 'function') {
          window.onunhandledrejection = wrapRejectionHandler(window.onunhandledrejection);
        }
        if (typeof window.onerror === 'function') {
          window.onerror = wrapErrorHandler(window.onerror);
        }

        // 5. Intercept future assignments to window.onunhandledrejection and window.onerror
        var _currentUnhandledRejection = window.onunhandledrejection;
        try {
          Object.defineProperty(window, 'onunhandledrejection', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentUnhandledRejection;
            },
            set: function(fn) {
              _currentUnhandledRejection = wrapRejectionHandler(fn);
            }
          });
        } catch (_) {}

        var _currentOnError = window.onerror;
        try {
          Object.defineProperty(window, 'onerror', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentOnError;
            },
            set: function(fn) {
              _currentOnError = wrapErrorHandler(fn);
            }
          });
        } catch (_) {}

        // 6. Capture event listeners on window with useCapture = true
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = event && event.reason;
            var msg = '' + (reason && (reason.stack || reason.message || reason));
            if (isBenign(msg)) {
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }
          } catch (_) {}
        }, true);

        window.addEventListener('error', function(event) {
          try {
            var msg = '' + (event && (event.message || (event.error && (event.error.stack || event.error.message))));
            if (isBenign(msg)) {
              if (typeof event.preventDefault === 'function') event.preventDefault();
              if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
              return true;
            }
          } catch (_) {}
        }, true);
      })();
    </script>
